  function shuffleArray(array) {
    const result = [...array];

    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }

    return result;
  }

  function startQuiz() {
    currentQuestions = shuffleArray(questionBank).slice(0, 10);
    selectedAnswers = {};

    quizContainer.innerHTML = "";
    resultBox.style.display = "none";
    retryButton.style.display = "none";
    submitQuizButton.style.display = "block";

    quizProgress.textContent =
      `Answer all 10 questions. You need 5 correct answers to unlock the gallery.`;

    currentQuestions.forEach((question, index) => {
      const questionBox = document.createElement("div");
      questionBox.className = "question-box";

      const heading = document.createElement("h3");
      heading.textContent = `${index + 1}. ${question.question}`;
      questionBox.appendChild(heading);

      const answers = document.createElement("div");
      answers.className = "answers";

      shuffleArray(question.options).forEach(option => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer-button";
        button.textContent = option;

        button.addEventListener("click", () => {
          selectedAnswers[index] = option;

          answers.querySelectorAll(".answer-button").forEach(item => {
            item.classList.remove("selected");
            item.setAttribute("aria-pressed", "false");
          });

          button.classList.add("selected");
          button.setAttribute("aria-pressed", "true");

          quizProgress.textContent =
            `${Object.keys(selectedAnswers).length} of 10 questions answered`;
        });

        button.setAttribute("aria-pressed", "false");
        answers.appendChild(button);
      });

      questionBox.appendChild(answers);
      quizContainer.appendChild(questionBox);
    });

    quizProgress.textContent = "0 of 10 questions answered";
  }

  function submitQuiz() {
    if (Object.keys(selectedAnswers).length < 10) {
      resultBox.className = "fail-result";
      resultBox.style.display = "block";
      resultBox.textContent =
        `Please answer all 10 questions first. You have answered ${Object.keys(selectedAnswers).length} out of 10.`;
      return;
    }

    let score = 0;

    currentQuestions.forEach((question, index) => {
      if (selectedAnswers[index] === question.answer) {
        score++;
      }
    });

    submitQuizButton.style.display = "none";
    resultBox.style.display = "block";

    if (score >= 5) {
      resultBox.className = "pass-result";
      resultBox.textContent =
        `🎉 Well done! You scored ${score}/10. The gallery is now unlocked.`;

      quizProgress.textContent = "Access granted";
      gallerySection.style.display = "block";

      loadGallery();

      setTimeout(() => {
        gallerySection.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }, 250);
    } else {
      resultBox.className = "fail-result";
      resultBox.textContent =
        `You scored ${score}/10. You need at least 5 correct answers. Try again with a new set of questions.`;

      retryButton.style.display = "block";
      quizProgress.textContent = "Access denied — try again";
    }
  }

  submitQuizButton.addEventListener("click", submitQuiz);

  function fixImagePath(path) {
    if (!path || typeof path !== "string") return "";

    const cleanPath = path.trim();

    if (
      cleanPath.startsWith("https://") ||
      cleanPath.startsWith("http://") ||
      cleanPath.startsWith("data:") ||
      cleanPath.startsWith("blob:")
    ) {
      return cleanPath;
    }

    return cleanPath.replace(/^\.?\//, "");
  }

  function normalizeGalleryItem(item, index, source) {
    if (!item || typeof item !== "object") return null;

    const imagePath =
      item.imageUrl ||
      item.file ||
      item.image ||
      item.url ||
      item.downloadURL ||
      "";

    const imageUrl = fixImagePath(imagePath);

    if (!imageUrl) return null;

    return {
      id: item.id || `${source}-${index}`,
      title: item.title || item.name || `Memory ${index + 1}`,
      description:
        item.description ||
        item.caption ||
        "A moment from my personal collection.",
      imageUrl,
      source
    };
  }

  async function readGalleryPath(db, path, source) {
    try {
      const snapshot = await get(ref(db, path));

      if (!snapshot.exists()) return [];

      const data = snapshot.val();
      let items = [];

      if (Array.isArray(data)) {
        items = data;
      } else if (data && typeof data === "object") {
        items = Object.entries(data).map(([key, value]) => ({
          id: key,
          ...(value && typeof value === "object" ? value : {})
        }));
      }

      return items
        .map((item, index) => normalizeGalleryItem(item, index, source))
        .filter(Boolean);
    } catch (error) {
      console.warn(`Could not read ${source} gallery path "${path}":`, error);
      return [];
    }
  }

  }

  function renderGallery() {
    const searchTerm = gallerySearch.value.trim().toLowerCase();
    const sortMode = gallerySort.value;

    visibleItems = galleryItems.filter(item => {
      const searchableText =
        `${item.title} ${item.description}`.toLowerCase();

      return searchableText.includes(searchTerm);
    });

    if (sortMode === "title") {
      visibleItems.sort((a, b) =>
        a.title.localeCompare(b.title)
      );
    } else if (sortMode === "title-desc") {
      visibleItems.sort((a, b) =>
        b.title.localeCompare(a.title)
      );
    }

    photoTotal.textContent = galleryItems.length;
    photoVisible.textContent = visibleItems.length;
    galleryCount.textContent =
      `${visibleItems.length} photo${visibleItems.length === 1 ? "" : "s"}`;

    galleryContainer.innerHTML = "";

    if (visibleItems.length === 0) {
      galleryContainer.innerHTML = `
        <div class="empty-gallery">
          <h3>No photos found</h3>
          <p>Try another search, or check that your images are in the images folder.</p>
        </div>
      `;
      return;
    }

    visibleItems.forEach((item, index) => {
      const card = document.createElement("article");
      card.className = "gallery-card";
      card.style.animationDelay = `${Math.min(index * 45, 400)}ms`;

      const imageWrap = document.createElement("div");
      imageWrap.className = "image-wrap";

      const image = document.createElement("img");
      image.src = item.imageUrl;
      image.alt = item.title;
      image.loading = "lazy";
      image.decoding = "async";

      image.addEventListener("click", () => openModal(index));

      image.addEventListener("error", () => {
        image.alt = `${item.title} — image could not be loaded`;
        image.style.opacity = ".35";
      });

      imageWrap.appendChild(image);

      const info = document.createElement("div");
      info.className = "gallery-info";

      const title = document.createElement("h3");
      title.textContent = item.title;

      const description = document.createElement("p");
      description.textContent = item.description;

      info.appendChild(title);
      info.appendChild(description);

      card.appendChild(imageWrap);
      card.appendChild(info);
      galleryContainer.appendChild(card);
    });
  }

  gallerySearch.addEventListener("input", renderGallery);
  gallerySort.addEventListener("change", renderGallery);
                                       function $(id) {
    return document.getElementById(id);
  }

  function fixImagePath(path) {
    if (!path || typeof path !== "string") return "";

    const cleanPath = path.trim();

    if (
      cleanPath.startsWith("https://") ||
      cleanPath.startsWith("http://") ||
      cleanPath.startsWith("data:") ||
      cleanPath.startsWith("blob:")
    ) {
      return cleanPath;
    }

    return cleanPath.replace(/^\.?\//, "");
  }

  function createGalleryCard(item, index) {
    const card = document.createElement("article");
    card.className = "gallery-card";

    const imagePath = fixImagePath(
      item.imageUrl || item.file || item.image || item.url || ""
    );

    const title = item.title || item.name || "Untitled";
    const description =
      item.description || item.caption || "A moment from my personal collection.";

    const wrap = document.createElement("div");
    wrap.className = "image-wrap";

    const image = document.createElement("img");
    image.src = imagePath;
    image.alt = title;
    image.loading = "lazy";
    image.decoding = "async";
    image.tabIndex = 0;
    image.setAttribute("role", "button");
    image.setAttribute("aria-label", `Open image: ${title}`);

    const open = () => openImageModal(index);

    image.addEventListener("click", open);

    image.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        open();
      }
    });

    image.addEventListener("error", () => {
      wrap.style.display = "none";
    });

    wrap.appendChild(image);

    const info = document.createElement("div");
    info.className = "gallery-info";

    const heading = document.createElement("h3");
    heading.textContent = title;

    const paragraph = document.createElement("p");
    paragraph.textContent = description;

    info.append(heading, paragraph);
    card.append(wrap, info);

    return card;
  }

  function renderGallery() {
    const container = $("gallery-container");
    const query = $("gallery-search").value.trim().toLowerCase();
    const sort = $("gallery-sort").value;

    let items = galleryItems
      .map((item, index) => ({ item, index }))
      .filter(({ item }) =>
        `${item.title || "Untitled"} ${item.description || ""}`
          .toLowerCase()
          .includes(query)
      );

    if (sort === "title") {
      items.sort((a, b) =>
        (a.item.title || "Untitled").localeCompare(
          b.item.title || "Untitled"
        )
      );
    }

    if (sort === "title-desc") {
      items.sort((a, b) =>
        (b.item.title || "Untitled").localeCompare(
          a.item.title || "Untitled"
        )
      );
    }

    container.replaceChildren();

    if (!items.length) {
      const empty = document.createElement("div");
      empty.className = "empty-gallery";
      empty.innerHTML =
        "<h3>No matching memories</h3><p>Try another search term.</p>";

      container.appendChild(empty);
    } else {
      items.forEach(({ item, index }) => {
        container.appendChild(createGalleryCard(item, index));
      });
    }

    $("photo-visible").textContent = items.length;
    $("gallery-count").textContent =
      `${items.length} of ${galleryItems.length} photos`;
    $("photo-total").textContent = galleryItems.length;
  }

  async function loadGallery() {
    const container = $("gallery-container");
    container.innerHTML =
      '<div class="loading">⚡ Loading your memories…</div>';

    const [oldResult, dashboardResult] = await Promise.allSettled([
      get(ref(database, "gallery")),
      get(ref(dashboardDatabase, "dashboardGallery"))
    ]);

    const oldItems = [];
    const dashboardItems = [];

    if (oldResult.status === "fulfilled" && oldResult.value.exists()) {
      const data = oldResult.value.val();
      const items = Array.isArray(data) ? data : Object.values(data);
      oldItems.push(
        ...items.filter(item => item && typeof item === "object")
      );
    } else if (oldResult.status === "rejected") {
      console.warn(
        "Could not load the original gallery:",
        oldResult.reason
      );
    }

    if (
      dashboardResult.status === "fulfilled" &&
      dashboardResult.value.exists()
    ) {
      const data = dashboardResult.value.val();
      const items = Array.isArray(data) ? data : Object.values(data);
      dashboardItems.push(
        ...items.filter(item => item && typeof item === "object")
      );
    } else if (dashboardResult.status === "rejected") {
      console.warn(
        "Could not load dashboard gallery:",
        dashboardResult.reason
      );
    }

    const githubImages = [
      {
        title: "Memory 1",
        description: "A moment from my personal collection.",
        imageUrl: "images/SaveClip.App_861099195_17994698292100264_2773230497532578772_n.jpg"
      },
      {
        title: "Memory 2",
        description: "A moment from my personal collection.",
        imageUrl: "images/SaveClip.App_864735920_17994698418100264_8565623279210335884_n.jpg"
      },
      {
        title: "Memory 3",
        description: "A moment from my personal collection.",
        imageUrl: "images/SaveClip.App_864853141_17994698175100264_4488882896880932263_n.jpg"
      },
      {
        title: "Memory 4",
        description: "A moment from my personal collection.",
        imageUrl: "images/SaveClip.App_866979820_17994698322100264_3521155655178586417_n.jpg"
      },
      {
        title: "Memory 5",
        description: "A moment from my personal collection.",
        imageUrl: "images/SaveClip.App_868028766_17994698439100264_6218611061983217428_n.jpg"
      },
      {
        title: "Memory 6",
        description: "A moment from my personal collection.",
        imageUrl: "images/SaveClip.App_870141323_17994698256100264_2782056032105923958_n.jpg"
      }
    ];

    galleryItems = [...oldItems, ...dashboardItems, ...githubImages];

    if (!galleryItems.length) {
      container.innerHTML =
        "<div class='empty-gallery'>" +
        "<h3>No gallery pictures could be loaded.</h3>" +
        "<p>Check your internet connection and read permissions for both Firebase databases.</p>" +
        "</div>";

      updateCounts();
      return;
    }

    renderGallery();
  }

  function updateCounts() {
    $("photo-total").textContent = galleryItems.length;
    $("photo-visible").textContent = 0;
    $("gallery-count").textContent =
      `0 of ${galleryItems.length} photos`;
  }

  $("gallery-search").addEventListener("input", renderGallery);
  $("gallery-sort").addEventListener("change", renderGallery);

  function openImageModal(index) {
    if (!galleryItems.length) return;

    currentModalIndex =
      (index + galleryItems.length) % galleryItems.length;

    const item = galleryItems[currentModalIndex];

    $("modalImage").src = fixImagePath(
      item.imageUrl || item.file || item.image || item.url || ""
    );

    $("modalImage").alt = item.title || "Gallery image";

    $("modalCaption").textContent = [
      item.title || "Untitled",
      item.description || ""
    ].filter(Boolean).join(" — ");

    $("imageModal").style.display = "flex";
    document.body.style.overflow = "hidden";
    $("close-modal").focus();
  }

  function closeImageModal() {
    $("imageModal").style.display = "none";
    $("modalImage").src = "";
    document.body.style.overflow = "";
  }

  function moveModal(step) {
    openImageModal(currentModalIndex + step);
  }

  $("close-modal").addEventListener("click", closeImageModal);

  $("prev-image").addEventListener("click", () => moveModal(-1));
  $("next-image").addEventListener("click", () => moveModal(1));

  $("imageModal").addEventListener("click", event => {
    if (event.target.id === "imageModal") {
      closeImageModal();
    }
  });

  document.addEventListener("keydown", event => {
    if ($("imageModal").style.display === "flex") {
      if (event.key === "Escape") closeImageModal();
      if (event.key === "ArrowLeft") moveModal(-1);
      if (event.key === "ArrowRight") moveModal(1);
    }
  });

  startQuiz();
</script>
