<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Documents | Clinton Ncube</title>

    <link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/favicon.png">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        nav {
            background: #000;
            padding: 15px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #d4af37;
        }

        .menu-btn {
            display: none;
            color: white;
            font-size: 25px;
            cursor: pointer;
        }

        .hero {
            min-height: 35vh;
            background:
                linear-gradient(
                    rgba(0,0,0,.7),
                    rgba(0,0,0,.8)
                ),
                url('images/court%20of%20gold.jfif');

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;

            color: white;
            padding: 40px 20px;
        }

        .hero h1 {
            font-size: 50px;
            text-transform: uppercase;
        }

        .hero p {
            margin-top: 10px;
            color: #ddd;
            font-size: 18px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 45px auto;
        }

        .top-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .top-section h2 {
            font-size: 25px;
        }

        .upload-btn {
            background: #111;
            color: white;
            padding: 13px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .upload-btn:hover {
            background: #d4af37;
            color: #111;
        }

        .search {
            margin: 25px 0;
        }

        .search input {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0,0,0,.08);
            font-size: 15px;
            outline: none;
        }

        #filesContainer {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .file-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 18px rgba(0,0,0,.08);

            display: flex;
            gap: 18px;
            align-items: center;
        }

        .file-icon {
            width: 60px;
            height: 60px;
            min-width: 60px;

            background: #111;
            color: #d4af37;

            border-radius: 12px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 25px;
        }

        .file-info {
            flex: 1;
        }

        .file-info h3 {
            font-size: 18px;
            word-break: break-word;
        }

        .file-info p {
            color: #777;
            font-size: 13px;
            margin-top: 5px;
        }

        .download {
            display: inline-block;
            margin-top: 12px;
            background: #111;
            color: white;
            padding: 9px 14px;
            border-radius: 7px;
            text-decoration: none;
            font-size: 13px;
        }

        .download:hover {
            background: #d4af37;
            color: #111;
        }

        .empty {
            grid-column: 1 / -1;
            background: white;
            padding: 60px 20px;
            border-radius: 15px;
            text-align: center;
            color: #777;
        }

        .empty i {
            font-size: 50px;
            color: #ccc;
            margin-bottom: 15px;
        }

        footer {
            background: #000;
            color: #aaa;
            text-align: center;
            padding: 25px;
            margin-top: 60px;
        }

        footer strong {
            color: white;
        }

        @media(max-width:800px) {

            .menu-btn {
                display: block;
            }

            .nav-links {
                display: none;
                position: absolute;
                top: 65px;
                left: 0;
                width: 100%;
                background: #000;
                flex-direction: column;
                gap: 0;
                text-align: center;
            }

            .nav-links.active {
                display: flex;
            }

            .nav-links li {
                padding: 15px;
                border-top: 1px solid #222;
            }

            .hero h1 {
                font-size: 36px;
            }

            #filesContainer {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<nav>

    <a href="index.html" class="logo">
        Clinton Ncube
    </a>

    <div class="menu-btn" onclick="toggleMenu()">
        <i class="fas fa-bars"></i>
    </div>

    <ul class="nav-links" id="navLinks">

        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="achievements.html">Achievements</a></li>
        <li><a href="skills.html">Skills</a></li>
        <li><a href="hobbies.html">Hobbies</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="files.html" class="active">Files</a></li>
        <li><a href="contact.html">Contact</a></li>

    </ul>

</nav>


<section class="hero">

    <div>
        <h1>Documents</h1>

        <p>
            Download documents, projects and other files.
        </p>
    </div>

</section>


<div class="container">

    <div class="top-section">

        <h2>
            <i class="fas fa-folder-open"></i>
            My Documents
        </h2>

        <!--
            This button is kept here for you.
            Uploading should be done from the admin dashboard.
        -->

        <button
            class="upload-btn"
            onclick="window.location.href='admin.html'">

            <i class="fas fa-upload"></i>
            Add Files

        </button>

    </div>


    <div class="search">

        <input
            type="text"
            id="searchInput"
            placeholder="Search documents..."
            oninput="displayFiles()">

    </div>


    <div id="filesContainer">

        <div class="empty">

            <i class="fas fa-spinner fa-spin"></i>

            <h3>Loading documents...</h3>

        </div>

    </div>

</div>


<footer>

    <p>
        © 2026 <strong>Clinton Ncube</strong>.
        All Rights Reserved.
    </p>

</footer>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>


<script>

const firebaseConfig = {

    apiKey: "AIzaSyB66c1Tymv5lkTxY89HLbX4S_QTpAZQVUE",

    authDomain: "clinton-ncube-website.firebaseapp.com",

    databaseURL:
        "https://clinton-ncube-website-default-rtdb.firebaseio.com",

    projectId: "clinton-ncube-website",

    storageBucket:
        "clinton-ncube-website.firebasestorage.app",

    messagingSenderId: "946671700613",

    appId:
        "1:946671700613:web:5d74536df1dbb0d35e77ec",

    measurementId: "G-K1S62MHHXP"

};


firebase.initializeApp(firebaseConfig);


const database =
    firebase.database();

const filesRef =
    database.ref("documents");


let files = [];


/* LOAD DOCUMENTS */

filesRef.on("value", snapshot => {

    files = [];

    snapshot.forEach(child => {

        files.push({

            id: child.key,

            ...child.val()

        });

    });

    displayFiles();

});


/* DISPLAY */

function displayFiles() {

    const container =
        document.getElementById("filesContainer");

    const search =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase();

    container.innerHTML = "";


    const filtered =
        files.filter(file => {

            const name =
                (file.name || "").toLowerCase();

            const description =
                (file.description || "").toLowerCase();

            return (
                name.includes(search) ||
                description.includes(search)
            );

        });


    if (filtered.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <i class="fas fa-folder-open"></i>

                <h3>No documents available</h3>

                <p>
                    Documents uploaded by the administrator
                    will appear here.
                </p>

            </div>

        `;

        return;

    }


    filtered.forEach(file => {

        const extension =
            (file.name || "")
                .split(".")
                .pop()
                .toUpperCase();


        let icon = "fa-file";

        if (extension === "PDF")
            icon = "fa-file-pdf";

        else if (
            extension === "DOC" ||
            extension === "DOCX"
        )
            icon = "fa-file-word";

        else if (
            extension === "XLS" ||
            extension === "XLSX"
        )
            icon = "fa-file-excel";

        else if (
            extension === "PPT" ||
            extension === "PPTX"
        )
            icon = "fa-file-powerpoint";


        const card =
            document.createElement("div");

        card.className = "file-card";


        card.innerHTML = `

            <div class="file-icon">

                <i class="fas ${icon}"></i>

            </div>


            <div class="file-info">

                <h3>
                    ${escapeHTML(file.name || "Document")}
                </h3>

                <p>
                    ${escapeHTML(
                        file.description || "Document"
                    )}
                </p>


                <a
                    class="download"
                    href="${file.url}"
                    download="${escapeHTML(file.name || "document")}"
                    target="_blank">

                    <i class="fas fa-download"></i>
                    Download

                </a>

            </div>

        `;


        container.appendChild(card);

    });

}


/* SECURITY */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* MENU */

function toggleMenu() {

    document
        .getElementById("navLinks")
        .classList.toggle("active");

}

</script>

</body>
</html>
