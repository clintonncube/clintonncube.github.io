<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Skills | Clinton Ncube</title>

    <link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/favicon.png">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav>

    <a href="index.html" class="logo">
        Clinton Ncube
    </a>

    <button
        class="menu-toggle"
        id="menuToggle"
        aria-label="Open navigation menu"
        aria-expanded="false">
        ☰
    </button>

    <ul class="nav-menu" id="navMenu">

        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="achievements.html">Achievements</a></li>
        <li><a href="skills.html">Skills</a></li>
        <li><a href="hobbies.html">Hobbies</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>

    </ul>

</nav>

<header class="page-header">

    <h1>My Skills</h1>

    <p>
        Skills I am learning and developing.
    </p>

</header>

<section>

    <div class="container">

        <div
            id="skillsContainer"
            class="cards">

            <div class="loading">
                Loading skills...
            </div>

        </div>

    </div>

</section>

<footer>

    <p>
        © 2026 Clinton Ncube. All rights reserved.
    </p>

    <p>
        Personal Portfolio Website
    </p>

</footer>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

const firebaseConfig = {

    apiKey:
        "AIzaSyB66c1Tymv5lkTxY89HLbX4S_QTpAZQVUE",

    authDomain:
        "clinton-ncube-website.firebaseapp.com",

    databaseURL:
        "https://clinton-ncube-website-default-rtdb.firebaseio.com",

    projectId:
        "clinton-ncube-website",

    storageBucket:
        "clinton-ncube-website.firebasestorage.app",

    messagingSenderId:
        "946671700613",

    appId:
        "1:946671700613:web:5d74536df1dbb0d35e77ec",

    measurementId:
        "G-K1S62MHHXP"
};

const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);

const skillsRef =
    ref(db, "skills");

const container =
    document.getElementById(
        "skillsContainer"
    );

onValue(
    skillsRef,
    (snapshot) => {

        container.innerHTML = "";

        const data =
            snapshot.val();

        if (!data) {

            container.innerHTML = `
                <div class="empty">
                    No skills have been added yet.
                </div>
            `;

            return;
        }

        Object.values(data)
            .forEach(skill => {

                const card =
                    document.createElement("div");

                card.className = "card";

                const title =
                    document.createElement("h3");

                title.textContent =
                    "💻 " +
                    (skill.title || "Skill");

                const description =
                    document.createElement("p");

                description.textContent =
                    skill.description || "";

                card.appendChild(title);

                card.appendChild(description);

                container.appendChild(card);

            });

    },
    (error) => {

        container.innerHTML = `
            <div class="empty">
                Unable to load skills.
            </div>
        `;

        console.error(error);

    }
);

</script>

<script>

const menuToggle =
    document.getElementById("menuToggle");

const navMenu =
    document.getElementById("navMenu");

menuToggle.addEventListener("click", () => {

    navMenu.classList.toggle("active");

    const isOpen =
        navMenu.classList.contains("active");

    menuToggle.setAttribute(
        "aria-expanded",
        isOpen
    );

    menuToggle.textContent =
        isOpen ? "✕" : "☰";
});

document.querySelectorAll(".nav-menu a")
    .forEach(link => {

        link.addEventListener("click", () => {

            navMenu.classList.remove("active");

            menuToggle.textContent = "☰";

            menuToggle.setAttribute(
                "aria-expanded",
                "false"
            );

        });

    });

</script>

</body>
</html>
